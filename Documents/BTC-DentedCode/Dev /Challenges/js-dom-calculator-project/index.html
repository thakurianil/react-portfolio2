<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="./index.css" rel="stylesheet" \>



</head>

<body>
    <div class="wrapper">
        <div class="calculator">
            <div class="display">
                <div></div>
            </div>
            <div class="part1">
                <div class="btnac">AC</div>
                <div class="btnc">C</div>
                <div class="btnpercent">%</div>
                <div class="btndivide">/</div>
            </div>
            <div class="part2">
                <div class="btn7">7</div>
                <div class="btn8">8</div>
                <div class="btn9">9</div>
                <div class="btnmultiple">*</div>
            
            </div>
            <div class="part3">
                <div class="btn4">4</div>
                <div class="btn5">5</div>
                <div class="btn6">6</div>
                <div class="btnsubtract">-</div>

            </div>
            <div class="part4">
                <div class="btn1">1</div>
                <div class="btn2">2</div>
                <div class="btn3">3</div>
            <div class="btnadd">+</div>

            </div>
            <div class="part5">
                <div class="btn0">0</div>
                <div class="btndot">.</div>
            <div class="btnequals">=</div>

            </div>



        </div>
    </div>

</body>

</html>
